<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Exemplares de Livros</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="layout">

    <!-- BOTÃO MENU -->
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div id="overlay" onclick="toggleMenu()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <img src="/images/logo.png" class="logo">

        <a th:href="@{/}" class="menu-item">
            🏠 <span class="menu-text">Início</span>
        </a>
        <a href="/alunos" class="menu-item">📚 <span class="menu-text">Alunos</span></a>
        <a href="/responsaveis" class="menu-item">👨‍👩‍👧 <span class="menu-text">Responsáveis</span></a>

        <a href="/livros/lista" class="menu-item">
            📚 <span class="menu-text">Livros</span>
        </a>

        <a href="/exemplares/lista" class="menu-item">
            📖 <span class="menu-text">Exemplares de Livros</span>
        </a>

        <a href="/multas" class="menu-item">💰 <span class="menu-text">Multas</span></a>
        <a href="/emprestimos" class="menu-item">📕 <span class="menu-text">Empréstimos</span></a>
    </div>

    <!-- CONTEÚDO -->
    <div class="content" id="content">
        <div class="content-inner">

            <h1>📖 Exemplares de Livros</h1>

            <!-- AÇÕES -->
            <div class="form-actions" style="margin-bottom: 20px;">

                <a href="/exemplares/form" class="btn btn-primary">
                    + Adicionar exemplar
                </a>

            </div>

            <h2>Lista de Exemplares</h2>

            <!-- TABELA -->
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Gênero</th>
                    <th>Descrição</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="ex : ${exemplares}">
                    <td th:text="${ex.cod}"></td>
                    <td th:text="${ex.livro.titulo}"></td>
                    <td th:text="${ex.livro.autor != null ? ex.livro.autor.nome : 'Sem autor'}"></td>
                    <td th:text="${ex.livro.genero != null ? ex.livro.genero.nome : 'Sem gênero'}"></td>
                    <td th:text="${ex.livro.descricao}"></td>
                    <td th:text="${ex.status}"></td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<script>
    function toggleMenu() {
        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content");

        sidebar.classList.toggle("collapsed");
        content.classList.toggle("collapsed");
    }
</script>

</body>
</html>
