<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Responsáveis</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="layout">

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div id="overlay" onclick="toggleMenu()"></div>

    <div class="sidebar" id="sidebar">
        <img src="/images/logo.png" class="logo">

        <a th:href="@{/}" class="menu-item">🏠 <span class="menu-text">Início</span></a>
        <a href="/alunos" class="menu-item">📚 <span class="menu-text">Alunos</span></a>
        <a href="/responsaveis" class="menu-item">👨‍👩‍👧 <span class="menu-text">Responsáveis</span></a>
        <a href="/livros/lista" class="menu-item">📚 <span class="menu-text">Livros</span></a>
        <a href="/exemplares/lista" class="menu-item">📖 <span class="menu-text">Exemplares de Livros</span></a>
        <a href="/multas" class="menu-item">💰 <span class="menu-text">Multas</span></a>
        <a href="/emprestimos" class="menu-item">📕 <span class="menu-text">Empréstimos</span></a>
    </div>

    <div class="content" id="content">
        <div class="content-inner">

            <h1>👨‍👩‍👧 Responsáveis</h1>

            <div th:if="${erro}" class="erro">
                <p th:text="${erro}"></p>
            </div>

            <form th:action="@{/responsaveis}" th:object="${responsavel}" method="post">

                <label>Nome:</label>
                <input type="text" th:field="*{nome}" required />

                <label>Endereço:</label>
                <input type="text" th:field="*{endereco}" />

                <label>Telefone:</label>
                <input type="text" th:field="*{telefone}" />

                <label>CPF:</label>
                <input type="text" th:field="*{cpf}" required />

                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>

            <hr/>

            <h2>Lista de Responsáveis</h2>

            <table>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Endereço</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="r : ${responsaveis}">
                    <td th:text="${r.nome}"></td>
                    <td th:text="${r.cpf}"></td>
                    <td th:text="${r.endereco}"></td>
                    <td th:text="${r.telefone}"></td>

                    <td>
                        <form th:action="@{'/responsaveis/deletar/' + ${r.id}}" method="post">
                            <button type="submit"
                                    class="btn btn-danger"
                                    onclick="return confirm('Deseja excluir este responsável?')">
                                Excluir
                            </button>
                        </form>
                    </td>
                </tr>
            </table>

        </div>
    </div>

</div>

<script>
    function toggleMenu() {
        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content");

        sidebar.classList.toggle("collapsed");
        content.classList.toggle("collapsed");
    }
</script>

</body>
</html>
