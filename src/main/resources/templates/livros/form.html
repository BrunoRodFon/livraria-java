<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adicionar Livro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="layout">

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div id="overlay" onclick="toggleMenu()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <img src="/images/logo.png" class="logo">

        <a th:href="@{/}" class="menu-item">
            🏠 <span class="menu-text">Início</span>
        </a>
        <a href="/alunos" class="menu-item">📚 <span class="menu-text">Alunos</span></a>
        <a href="/responsaveis" class="menu-item">👨‍👩‍👧 <span class="menu-text">Responsáveis</span></a>
        <a href="/livros/lista" class="menu-item">📚 <span class="menu-text">Livros</span></a>
        <a href="/exemplares/lista" class="menu-item">📖 <span class="menu-text">Exemplares de Livros</span></a>
        <a href="/multas" class="menu-item">💰 <span class="menu-text">Multas</span></a>
        <a href="/emprestimos" class="menu-item">📕 <span class="menu-text">Empréstimos</span></a>
    </div>

    <!-- CONTEÚDO -->
    <div class="content" id="content">
        <div class="content-inner">

            <h1>➕ Adicionar Livro</h1>

            <form th:action="@{/livros/salvar}" th:object="${livro}" method="post">

                <!-- TÍTULO -->
                <label>Título *</label>
                <input type="text" th:field="*{titulo}" required/>

                <!-- AUTOR -->
                <label>Autor *</label>
                <select th:field="*{autor.id}" required>
                    <option value="">Selecione</option>
                    <option th:each="autor : ${autores}"
                            th:value="${autor.id}"
                            th:text="${autor.nome}">
                    </option>
                </select>

                <a href="/autores/form" class="btn btn-small">
                    + Adicionar novo autor
                </a>

                <!-- GÊNERO -->
                <label style="margin-top: 10px;">Gênero *</label>
                <select th:field="*{genero.id}" required>
                    <option value="">Selecione</option>
                    <option th:each="genero : ${generos}"
                            th:value="${genero.id}"
                            th:text="${genero.nome}">
                    </option>
                </select>

                <a href="/generos/form" class="btn btn-small">
                    + Adicionar novo gênero
                </a>

                <!-- DESCRIÇÃO -->
                <label style="margin-top: 10px;">Descrição</label>
                <textarea th:field="*{descricao}"></textarea>

                <!-- AÇÕES -->
                <div class="form-actions">

                    <button type="submit" class="btn btn-primary">
                        Salvar
                    </button>

                    <a href="/exemplares/lista" class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

<script>
    function toggleMenu() {
        document.getElementById("sidebar").classList.toggle("collapsed");
        document.getElementById("content").classList.toggle("collapsed");
    }
</script>

</body>
</html>
