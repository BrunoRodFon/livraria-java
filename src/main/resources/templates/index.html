<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Livraria - Início</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 1000px; /* 🔥 ALTERADO: mais largura para melhor layout */
            margin: 60px auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 40px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px; /* 🔥 ALTERADO: mais espaçamento */
        }

        .card {
            padding: 40px; /* 🔥 ALTERADO: maior área clicável */
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 20px; /* 🔥 ALTERADO */
            font-weight: bold;
            display: flex; /* 🔥 ALTERADO */
            align-items: center; /* 🔥 ALTERADO */
            justify-content: center; /* 🔥 ALTERADO */
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05); /* 🔥 ALTERADO */
            opacity: 0.95;
        }

        /* CORES PADRÃO DO SISTEMA */
        .alunos {
            background-color: #007BFF;
        }

        .responsaveis {
            background-color: #28a745;
        }

        .livros {
            background-color: #8B4513;
        }

        .emprestimos {
            background-color: #6f42c1; /* 🔥 NOVO: roxo padrão empréstimos */
        }

        .multas {
            background-color: #ffc107; /* 🔥 ALTERADO: amarelo (melhor que cinza) */
            color: #000; /* 🔥 ALTERADO: contraste */
        }

    </style>
</head>
<body>

<div class="container">

    <h1>📚 Sistema de Livraria</h1> <!-- 🔥 ALTERADO: título com emoji -->

    <div class="menu">

        <!-- 🔥 PADRÃO CORRETO: card inteiro é clicável -->
        <a href="/alunos" class="card alunos">
            📚 Alunos
        </a>

        <a href="/responsaveis" class="card responsaveis">
            👨‍👩‍👧 Responsáveis
        </a>

        <a href="/exemplares/lista" class="card livros">
            📖 Livros
        </a>

        <!-- 🔥 CORREÇÃO IMPORTANTE -->
        <!-- Antes: <div> com <a> dentro ❌ -->
        <!-- Agora: <a> direto como card ✔ -->
        <a href="/emprestimos" class="card emprestimos">
            📕 Empréstimos
        </a>

        <!-- 🔥 CORREÇÃO IMPORTANTE -->
        <a href="/multas" class="card multas">
            💰 Multas
        </a>

    </div>

</div>

</body>
</html>
