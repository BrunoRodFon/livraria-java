<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Empréstimos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    .container {
      width: 900px; /* 🔥 PADRÃO */
      margin: 40px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
    }

    h1, h2 {
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #8B4513; /* 🔥 cor dos livros */
      color: white;
      border-radius: 6px;
      border: none;
      font-weight: bold;
    }

    button:hover {
      background-color: #6f3610;
    }

    .btn-voltar {
      display: inline-block;
      margin-bottom: 15px;
      color: #8B4513;
      font-weight: bold;
      text-decoration: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th {
      background-color: #8B4513;
      color: white;
      padding: 10px;
    }

    table td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📕 Empréstimos</h1>

  <a class="btn-voltar" th:href="@{/}">⬅ Voltar</a>

  <!-- FORM -->
  <form th:action="@{/emprestimos}" method="post">

    <label>Aluno:</label>
    <select name="alunoId" required>
      <option value="">Selecione</option>
      <option th:each="aluno : ${alunos}"
              th:value="${aluno.id}"
              th:text="${aluno.nome}">
      </option>
    </select>

    <label>Exemplar:</label>
    <select name="exemplarId" required>
      <option value="">Selecione</option>
      <option th:each="ex : ${exemplares}"
              th:value="${ex.id}"
              th:text="${ex.livro.titulo}">
      </option>
    </select>

    <button type="submit">Salvar</button>
  </form>

  <hr/>

  <h2>Lista de Empréstimos</h2>

  <table>
    <tr>
      <th>ID</th>
      <th>Aluno</th>
      <th>Livro</th>
      <th>Empréstimo</th>
      <th>Prevista</th>
      <th>Devolução</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>

    <tr th:each="emp : ${emprestimos}">
      <td th:text="${emp.id}"></td>
      <td th:text="${emp.aluno.nome}"></td>
      <td th:text="${emp.livroExemplar.livro.titulo}"></td>
      <td th:text="${emp.dtEmprestimo}"></td>
      <td th:text="${emp.dtPrevista}"></td>
      <td th:text="${emp.dtDevolucao}"></td>

      <!-- 🔥 STATUS COM COR -->
      <td>
        <span th:if="${emp.ativo}" style="color: green; font-weight: bold;">
            Ativo
        </span>
        <span th:if="${!emp.ativo}" style="color: red; font-weight: bold;">
            Finalizado
        </span>
      </td>

      <!-- 🔥 BOTÃO DEVOLVER CORRIGIDO -->
      <td>
        <form th:action="@{'/emprestimos/devolver/' + ${emp.id}}" method="post">
          <button type="submit"
                  th:if="${emp.ativo}"
                  style="background-color: #28a745;">
            Devolver
          </button>
        </form>
      </td>

    </tr>
  </table>

</div>

</body>
</html>
