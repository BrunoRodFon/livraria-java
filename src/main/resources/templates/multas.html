<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Multas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .container {
            width: 900px; /* 🔥 PADRÃO aplicado igual outras telas */
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
        }

        form {
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6f42c1; /* 🔥 cor padrão multas */
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        button:hover {
            background-color: #5a32a3;
        }

        .erro {
            background-color: #ffe5e5;
            color: #cc0000;
            padding: 10px;
            border-radius: 5px;
        }

        .btn-voltar {
            display: inline-block;
            margin-bottom: 15px;
            color: #6f42c1;
            text-decoration: none;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background-color: #6f42c1;
            color: white;
            padding: 10px;
        }

        table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>💰 Multas</h1>

    <a class="btn-voltar" th:href="@{/}">⬅ Voltar</a>

    <!-- 🔥 EXIBE ERRO DO BACKEND -->
    <div th:if="${erro}" class="erro">
        <p th:text="${erro}"></p>
    </div>

    <!-- 🔥 FORM CORRIGIDO -->
    <form th:action="@{/multas}" method="post">

        <!-- 🔥 CORREÇÃO IMPORTANTE -->
        <!-- NÃO usar th:field="*{emprestimo.id}" porque o controller espera @RequestParam -->
        <label>Empréstimo:</label>
        <select name="emprestimoId" required>
            <option value="">Selecione</option>
            <option th:each="emp : ${emprestimos}"
                    th:value="${emp.id}"
                    th:text="${emp.aluno.nome + ' - ' + emp.livroExemplar.livro.titulo}">
            </option>
        </select>

        <!-- 🔥 VALOR -->
        <label>Valor:</label>
        <input type="number" step="0.01" name="valor" required />

        <!-- 🔥 ENUM STATUS (PADRÃO JAVA) -->
        <label>Status:</label>
        <select name="status">
            <!-- 🔥 IMPORTANTE: valores devem bater com o ENUM -->
            <option value="PAGO">Pago</option>
            <option value="PENDENTE">Pendente</option>
        </select>

        <button type="submit">Salvar</button>
    </form>

    <hr/>

    <h2>Lista de Multas</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Aluno</th>
            <th>Livro</th>
            <th>Valor</th>
            <th>Status</th>
        </tr>

        <tr th:each="m : ${multas}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.emprestimo.aluno.nome}"></td>
            <td th:text="${m.emprestimo.livroExemplar.livro.titulo}"></td>
            <td th:text="${m.valor}"></td>

            <!-- 🔥 CORREÇÃO PROFISSIONAL -->
            <!-- comparar ENUM corretamente -->
            <td>
                <span th:if="${m.status.name() == 'PAGO'}"
                      style="color: green; font-weight: bold;">
                    Pago
                </span>

                <span th:if="${m.status.name() == 'PENDENTE'}"
                      style="color: red; font-weight: bold;">
                    Pendente
                </span>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
