<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Multas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="layout">

    <!-- BOTÃO MENU -->
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div id="overlay" onclick="toggleMenu()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <img src="/images/logo.png" class="logo">

        <a th:href="@{/}" class="menu-item">🏠 Início</a>
        <a href="/alunos" class="menu-item">📚 Alunos</a>
        <a href="/responsaveis" class="menu-item">👨‍👩‍👧 Responsáveis</a>
        <a href="/livros/lista" class="menu-item">📚 Livros</a>
        <a href="/exemplares/lista" class="menu-item">📖 Exemplares</a>
        <a href="/multas" class="menu-item">💰 Multas</a>
        <a href="/emprestimos" class="menu-item">📕 Empréstimos</a>
    </div>

    <!-- CONTEÚDO -->
    <div class="content" id="content">
        <div class="content-inner">

            <h1>💰 Multas</h1>

            <!-- ERRO -->
            <div th:if="${erro}"
                 style="margin-bottom:15px;
                        padding:10px;
                        background:#ffebeb;
                        color:#c62828;
                        border:1px solid #c62828;
                        border-radius:6px;
                        font-weight:bold;">

                <p th:text="${erro}"></p>

            </div>

            <!-- FORM -->
            <form th:action="@{/multas}" method="post">

                <label>Empréstimo:</label>
                <select name="emprestimoId" required>
                    <option value="">Selecione</option>
                    <option th:each="emp : ${emprestimos}"
                            th:value="${emp.id}"
                            th:text="${emp.aluno.nome + ' - ' + emp.livroExemplar.livro.titulo}">
                    </option>
                </select>

                <label>Valor:</label>
                <input type="number" step="0.01" name="valor" required />

                <label>Status:</label>
                <select name="status">
                    <option value="PAGO">Pago</option>
                    <option value="PENDENTE">Pendente</option>
                </select>

                <button type="submit" class="btn btn-primary">
                    Salvar
                </button>

            </form>

            <hr/>

            <h2>Lista de Multas</h2>

            <table>

                <tr>
                    <th>ID</th>
                    <th>Aluno</th>
                    <th>Livro</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="m : ${multas}">

                    <td th:text="${m.id}"></td>
                    <td th:text="${m.emprestimo.aluno.nome}"></td>
                    <td th:text="${m.emprestimo.livroExemplar.livro.titulo}"></td>
                    <td th:text="${m.valor}"></td>

                    <td>
                        <span th:if="${m.status.name() == 'PAGO'}"
                              style="color: green; font-weight: bold;">
                            Pago
                        </span>

                        <span th:if="${m.status.name() == 'PENDENTE'}"
                              style="color: red; font-weight: bold;">
                            Pendente
                        </span>
                    </td>

                    <td style="display:flex; gap:8px;">

                        <!-- FINALIZAR (PAGAR) -->
                        <form th:action="@{'/multas/finalizar/' + ${m.id}}"
                              method="post"
                              style="display:inline;">

                            <button type="submit"
                                    th:if="${m.status.name() == 'PENDENTE'}"
                                    class="btn btn-success"
                                    onclick="return confirm('Marcar multa como paga?')">
                                Finalizar
                            </button>

                        </form>

                        <!-- EXCLUIR -->
                        <form th:action="@{'/multas/deletar/' + ${m.id}}"
                              method="post"
                              style="display:inline;">

                            <button type="submit"
                                    th:if="${m.status.name() == 'PAGO'}"
                                    class="btn btn-danger"
                                    onclick="return confirm('Excluir multa?')">
                                Excluir
                            </button>

                        </form>

                    </td>

                </tr>

            </table>

        </div>
    </div>

</div>

<script>
    function toggleMenu() {
        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content");

        sidebar.classList.toggle("collapsed");
        content.classList.toggle("collapsed");
    }
</script>

</body>
</html>
