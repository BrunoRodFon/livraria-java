<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Multas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
        }

        form {
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .erro {
            background-color: #ffe5e5;
            color: #cc0000;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .link {
            margin-bottom: 15px;
        }

        .link a {
            text-decoration: none;
            color: #007BFF;
        }

        .link a:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background-color: #007BFF;
            color: white;
            padding: 10px;
        }

        table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        table tr:hover {
            background-color: #f1f1f1;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Cadastro de Multas</h1>

    <a th:href="@{/}">Home</a>

    <!-- FORM -->
    <form th:action="@{/multas}" th:object="${multa}" method="post">

        <label>Empréstimo:</label>
        <select name="emprestimo.id">
            <option value="">Selecione</option>
            <option th:each="emp : ${emprestimos}"
                    th:value="${emp.id}"
                    th:text="${emp.aluno.nome + ' - ' + emp.livroExemplar.livro.titulo}">
            </option>
        </select>

        <label>Valor:</label>
        <input type="number" step="0.01" th:field="*{valor}" required />

        <label>Pago:</label>
        <select th:field="*{status}">
            <option value="">Selecione</option>
            <option value="PAGO">Pago</option>
            <option value="PENDENTE">Pendente</option>
        </select>

        <button type="submit">Salvar</button>
    </form>

    <hr/>

    <!-- LISTA -->
    <h2>Lista de Multas</h2>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Aluno</th>
            <th>Livro</th>
            <th>Valor</th>
            <th>Pago</th>
        </tr>

        <tr th:each="m : ${multas}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.emprestimo.aluno.nome}"></td>
            <td th:text="${m.emprestimo.livroExemplar.livro.titulo}"></td>
            <td th:text="${m.valor}"></td>
            <td th:text="${m.pago ? 'Sim' : 'Não'}"></td>
        </tr>
    </table>

</div>

</body>
</html>
