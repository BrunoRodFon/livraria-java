<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Alunos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="layout">

    <!-- BOTÃO MENU -->
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div id="overlay" onclick="toggleMenu()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <img src="/images/logo.png" class="logo">

        <a th:href="@{/}" class="menu-item">
            🏠 <span class="menu-text">Início</span>
        </a>

        <a href="/alunos" class="menu-item">📚 <span class="menu-text">Alunos</span></a>
        <a href="/responsaveis" class="menu-item">👨‍👩‍👧 <span class="menu-text">Responsáveis</span></a>
        <a href="/livros/lista" class="menu-item">📚 <span class="menu-text">Livros</span></a>
        <a href="/exemplares/lista" class="menu-item">📖 <span class="menu-text">Exemplares de Livros</span></a>
        <a href="/multas" class="menu-item">💰 <span class="menu-text">Multas</span></a>
        <a href="/emprestimos" class="menu-item">📕 <span class="menu-text">Empréstimos</span></a>
    </div>

    <!-- CONTEÚDO -->
    <div class="content" id="content">
        <div class="content-inner">

            <h1>📚 Alunos</h1>

            <!-- ALERTA DE ERRO -->
            <div th:if="${erro}" style="color:red; font-weight:bold; margin-bottom:10px;">
                <p th:text="${erro}"></p>
            </div>

            <!-- FORMULÁRIO -->
            <form th:action="@{/alunos}" th:object="${aluno}" method="post">

                <label>Nome:</label>
                <input type="text" th:field="*{nome}" required />

                <!-- ❌ REMOVIDO CPF (não existe no model) -->

                <label>RA:</label>
                <input type="text" th:field="*{ra}" required />

                <label>Responsável:</label>
                <select th:field="*{responsavel.id}">
                    <option value="">Selecione</option>
                    <option th:each="r : ${responsaveis}"
                            th:value="${r.id}"
                            th:text="${r.nome}">
                    </option>
                </select>

                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>

            <hr/>

            <!-- TABELA -->
            <h2>Lista de Alunos</h2>

            <table>

                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>RA</th>
                    <th>Responsável</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="aluno : ${alunos}">

                    <td th:text="${aluno.id}"></td>
                    <td th:text="${aluno.nome}"></td>

                    <!-- ❌ REMOVIDO CPF -->
                    <td th:text="${aluno.ra}"></td>

                    <td th:text="${aluno.responsavel != null ? aluno.responsavel.nome : 'Sem responsável'}"></td>

                    <td style="display:flex; gap:5px;">

                        <!-- EXCLUIR -->
                        <form th:action="@{'/alunos/deletar/' + ${aluno.id}}" method="post">
                            <button type="submit"
                                    class="btn btn-danger"
                                    onclick="return confirm('Tem certeza que deseja excluir este aluno?')">
                                Excluir
                            </button>
                        </form>

                    </td>

                </tr>

            </table>

        </div>
    </div>

</div>

<script>
    function toggleMenu() {
        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content");

        sidebar.classList.toggle("collapsed");
        content.classList.toggle("collapsed");
    }
</script>

</body>
</html>
